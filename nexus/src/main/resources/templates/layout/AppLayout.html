<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:fragment="header">
    <!-- head content only (no enclosing <head> tag) so it can be inserted into pages' <head> -->
    <title th:text="${appProperty.appName}">App</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <!-- WebJar / static links -->
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.css}"/>
    <link th:href="@{/css/app.css}" rel="stylesheet"/>

    <!-- Scripts: jQuery first, then Bootstrap, then app script -->
    <script type="text/javascript" th:src="@{/webjars/jquery/3.7.1/jquery.min.js}"></script>
    <script type="text/javascript" th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
    <script type="text/javascript" th:src="@{/webjars/d3js/5.16.0/d3.min.js}"></script>
    <script type="text/javascript" th:src="@{/js/app.js}"></script>
</div>

<div th:fragment="nav">

    <!-- make navbar a positioned container so messages can be absolutely centered above it -->
    <nav class="navbar fixed-top bg-body-tertiary navbar-expand-lg" >
        <div class="container-fluid">
            <a class="navbar-brand ms-3" href="/"><span th:text="${appProperty.appName}"/></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarSupportedContent">

                <ul class="navbar-nav justify-content-end">

                    <li th:if="${sessionUser != null}" class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button"
                           data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="fa-solid fa-circle-user me-1"></i>
                            <span th:text="${sessionUser.screenName}"></span>
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                            <li><a class="dropdown-item" href="/Admin/Landing">Admin</a></li>
                            <li><a class="dropdown-item" href="#">Another action</a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li th:if="${sessionUser != null}" class="nav-item">
                                <a class="dropdown-item" href="/AppUser/Logout">Logout</a>
                            </li>

                        </ul>
                    </li>
                    <li th:if="${sessionUser == null}" class="nav-item">
                        <a class="nav-link" href="/AppUser/LoginForm">Login</a>
                    </li>

                </ul>

            </div>

            <!-- center navbar messages: absolutely centered (both axes), on top of navbar -->
            <div id="navbarMessages"
                 style="position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); z-index:1050; width:100%; display:flex; justify-content:center; gap:0.5rem; pointer-events:auto;">
                <div id="errorMsgId"
                     class="alert alert-danger mb-0"
                     role="alert"
                     style="display: none; max-width:60%;"
                     th:text="${T(app.session.SessionUtil).getErrorMsg(session)}"></div>

                <div id="warnMsgId"
                     class="alert alert-warning mb-0"
                     role="alert"
                     style="display: none; max-width:60%;"
                     th:text="${T(app.session.SessionUtil).getWarnMsg(session)}"></div>

                <div id="actionMsgId"
                     class="alert alert-success mb-0"
                     role="alert"
                     style="display: none; max-width:60%;"
                     th:text="${T(app.session.SessionUtil).getActionMsg(session)}"></div>
            </div>

            <!-- clear messages in session after rendering (no visible output) -->
            <span th:text="${T(app.session.SessionUtil).cleanViewedMsgs(session)}" style="display:none;"></span>

        </div>
    </nav>

    <script type="text/javascript">
        // Keep message-show logic inline (runs after jQuery loaded in header)
        $(document).ready(function () {
            if ($('#errorMsgId').text().trim() !== '') {
                $('#errorMsgId').show().delay(7000).fadeOut();
            }
            if ($('#warnMsgId').text().trim() !== '') {
                $('#warnMsgId').show().delay(6000).fadeOut();
            }
            if ($('#actionMsgId').text().trim() !== '') {
                $('#actionMsgId').show().delay(5000).fadeOut();
            }
        });
    </script>

             style="&#45;&#45;bs-breadcrumb-divider: '>'; padding-top: 0.3em; padding-bottom: 0.5em;"

                    <span th:if="${breadcrumb.url == null}"
                          th:text="${breadcrumb.label}"></span>
                </li>
            </ol>
        </div>
    </div>-->
    <span th:text="${T(app.session.SessionUtil).cleanViewedMsgs(session1)}"></span>
</div>
