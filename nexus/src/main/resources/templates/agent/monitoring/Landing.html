<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <header th:insert="layout/AppLayout.html :: header"></header>

    <!-- per-page styles moved to static/css/app.css for reuse and offline packaging -->
    <!-- removed inline style block — styles for .agent-card, .kv-list, .agent-icon, .kv-value, .icon-btn, #live-events-panel etc.
         are now in src/main/resources/static/css/app.css -->
</head>
<body>
<div th:insert="layout/AppLayout.html :: nav"></div>

<!-- Sidebar fragment reference -->
<div th:replace="layout/AppLayout.html :: sidebar"></div>

<div class="main-content mt-5">
    <div class="container-fluid py-4">
        <!-- Dashboard header -->
        <div class="d-flex align-items-center justify-content-between mb-3">
            <div class="ms-5">
                <h2 class="mb-0">Agents Dashboard</h2>
                <small class="text-muted">Overview of agents health</small>
            </div>
            <div>
                <!-- Notification button & Create -->
                <button id="notif-btn" class="btn btn-sm btn-outline-info position-relative me-2" type="button" aria-label="Notifications" onclick="if(window.AppWebsocket) AppWebsocket.toggleLiveEvents(event);">
                    <i class="bi bi-bell"></i>
                    <span id="notif-badge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="display:none; font-size:0.65rem; padding:0.25rem 0.45rem;">0</span>
                </button>
                <a class="btn btn-sm btn-primary" href="/Monitoring/Agent/CreateForm">Create</a>
            </div>
        </div>

        <!-- Dashboard grid: use Bootstrap grid so cards align & size properly -->
        <div class="row g-3">
            <!-- iterate agents provided by controller -->
            <div th:each="agent : ${agents}" class="col-12 col-sm-6 col-md-4 col-lg-3">
                <div class="custom-card kpi-card d-flex align-items-center p-2">
                    <div class="stat-icon me-2" style="width:40px;height:40px;display:flex;align-items:center;justify-content:center;">
                        <i class="bi bi-pc-display-horizontal" style="font-size:1.05rem;"></i>
                    </div>
                    <div class="d-flex flex-column">
                        <div class="stat-value mb-0" style="font-weight:700;font-size:1.05rem;" th:text="${agent.agentId}"></div>
                        <div class="stat-label text-muted small" th:text="${agent.displayName}"></div>
                    </div>
                </div>
            </div>
            <!-- fallback message when no agents -->
            <div th:if="${#lists.isEmpty(agents)}" class="col-12 text-center text-muted p-3">
                No agents found. <a href="/Monitoring/Agent/CreateForm">Create one</a>.
            </div>
        </div>

    </div>
</div>

<!-- Floating Live Events panel (restructured to use Bootstrap card-header/card-body) -->
<div id="live-events-panel" class="card shadow-sm" style="display:none;">
    <div class="card-header panel-header">
        <div class="title">Live Events</div>
        <div class="panel-controls" style="display:flex;gap:0.4rem;">
            <button class="btn btn-sm btn-outline-secondary" onclick="if(window.AppWebsocket) AppWebsocket.clearLiveEvents();">Clear</button>
            <button class="btn btn-sm btn-outline-danger" onclick="if(window.AppWebsocket) AppWebsocket.toggleLiveEvents();">Close</button>
        </div>
    </div>
    <div class="card-body p-0" style="max-height:52vh; overflow:auto;">
        <ul id="live-events-list" class="list-group list-group-flush">
            <li class="list-group-item no-events">No events yet.</li>
        </ul>
    </div>
</div>

<!-- initialize websocket client and live events wiring -->
<script type="text/javascript">
    (function(){
        try {
            var endpointPath = '/ws';
            if (window.AppWebsocket && typeof window.AppWebsocket.init === 'function') {
                window.AppWebsocket.init({
                    endpointPath: endpointPath,
                    topic: '/topic/agents/status',
                    liveEvents: true,
                    liveEventsPanelId: 'live-events-panel',
                    liveEventsListId: 'live-events-list',
                    liveEventsMax: 100
                });
            } else {
                console.warn('AppWebsocket module not loaded; live updates disabled');
            }
        } catch (e) {
            console.error('Failed initializing websocket client', e);
        }
    })();
</script>

</body>
</html>
