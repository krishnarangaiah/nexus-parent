<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <header th:insert="layout/AppLayout.html :: header"></header>
    <style>
        table.table-sm {
            table-layout: fixed; /* Fix the table layout */
            width: 100%; /* Ensure the table takes up the full width */
        }

        table.table-sm th, table.table-sm td {
            word-wrap: break-word; /* Prevent content overflow */
            overflow: hidden; /* Hide overflowing content */
            text-overflow: ellipsis; /* Add ellipsis for overflowing text */
            white-space: nowrap; /* Prevent text wrapping */
        }
    </style>
</head>
<body>
<div th:insert="layout/AppLayout.html :: nav"></div>

<div id="componentListId" class="container-fluid h-100">


    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card w-100 custom-card no-transform-card text-center mb-3">

                <div class="card-body">

                    <div class="card-title text-dark">
                        <h5 class="mb-0 fw-semibold">Add Component</h5>
                    </div>
                    <hr/>
                    <form id="addComponentForm" action="/Rates/Component/Save" method="post">

                        <div class="mb-3 row align-items-center">
                            <label for="componentName" class="col-sm-3 col-form-label text-end">Component
                                Name</label>
                            <div class="col-sm-9">
                                <input type="text" id="componentName" name="componentName" value="" class="form-control"
                                       required>
                            </div>
                        </div>

                        <div class="mb-3 row align-items-center">
                            <label for="description" class="col-sm-3 col-form-label text-end">Description</label>
                            <div class="col-sm-9">
                                <input type="text" id="description" name="description" class="form-control"
                                       required>
                            </div>
                        </div>

                        <div class="mb-3 row align-items-center">
                            <label for="environment" class="col-sm-3 col-form-label text-end">Environment</label>
                            <div class="col-sm-9">
                                <select id="environment" name="environment" class="form-select" required>
                                    <option value="" disabled selected>Select Environment</option>
                                    <option th:each="env : ${environments}" th:value="${env}"
                                            th:text="${env}"></option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3 row align-items-center">
                            <div class="offset-sm-3 col-sm-9">
                                <div class="form-check">
                                    <input type="checkbox" class="form-check-input" id="hasSubprocess"
                                           name="hasSubprocess">
                                    <label class="form-check-label" for="hasSubprocess">Has Subprocesses</label>
                                </div>
                            </div>
                        </div>

                        <div class="mb-3 row align-items-center">
                            <div class="offset-sm-3 col-sm-9">
                                <div class="form-check">
                                    <input type="checkbox" class="form-check-input" id="isActive"
                                           name="isActive">
                                    <label class="form-check-label" for="hasSubprocess">Is Active</label>
                                </div>
                            </div>
                        </div>

                        <div class="mb-3 row align-items-center">
                            <label for="host" class="col-sm-3 col-form-label text-end">Host</label>
                            <div class="col-sm-9">
                                <input type="text" id="host" name="host" class="form-control"
                                       placeholder="Host where it should run" required>
                            </div>
                        </div>

                        <div class="mb-3 row align-items-center">
                            <label for="logFileLocation" class="col-sm-3 col-form-label text-end">Log File
                                Location</label>
                            <div class="col-sm-9">
                                <input type="text" id="logFileLocation" name="logFileLocation" class="form-control"
                                       placeholder="Process log file location" required>
                            </div>
                        </div>

                        <div class="d-flex justify-content-center gap-2">
                            <button type="submit" class="btn btn-success btn-sm">Save</button>
                            <button type="button" id="cancelAddComponent" class="btn btn-secondary btn-sm">Cancel
                            </button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>


</div>
