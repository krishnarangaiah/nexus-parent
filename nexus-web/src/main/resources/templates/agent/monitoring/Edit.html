<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <header th:insert="layout/AppLayout.html :: header"></header>
</head>
<body>
<div th:insert="layout/AppLayout.html :: nav"></div>

<!-- Sidebar fragment reference -->
<div th:replace="layout/AppLayout.html :: sidebar"></div>

<div class="main-content mt-5">
    <div class="container-fluid py-4">
        <div class="d-flex align-items-center justify-content-between mb-3">
            <div class="ms-5">
                <h2 class="mb-0">Edit Agent</h2>
                <small class="text-muted">Modify agent details</small>
            </div>
            <div class="me-5">
                <a class="btn btn-outline-secondary" href="/Monitoring/Agent/Landing">Back to Dashboard</a>
            </div>
        </div>

        <div class="row">
            <div class="col-lg-8">
                <!-- form bound to 'agent' model attribute provided by controller -->
                <form id="edit-agent-form" method="post" th:action="@{/Monitoring/Agent/Update}" novalidate>
                    <div th:if="${_csrf != null}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    </div>

                    <div class="custom-card p-3">
                        <h5 class="mb-3">Agent Details</h5>

                        <!-- hidden id for binding -->
                        <input type="hidden" name="id" th:value="${agent != null} ? ${agent.id} : ''"/>

                        <div class="row g-2">
                            <div class="col-md-6">
                                <label class="form-label">Agent ID</label>
                                <input id="agent-id" name="agentId" type="text" class="form-control" required
                                       placeholder="e.g. agent-1" th:value="${agent != null} ? ${agent.agentId} : ''"/>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Display Name</label>
                                <input id="agent-name" name="displayName" type="text" class="form-control"
                                       placeholder="Human-friendly name" required th:value="${agent != null} ? ${agent.displayName} : ''"/>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Status</label>
                                <select id="agent-status" name="status" class="form-select" required>
                                    <option th:selected="${agent != null and agent.status == 'ACTIVE'}" value="ACTIVE">Active</option>
                                    <option th:selected="${agent != null and agent.status == 'INACTIVE'}" value="INACTIVE">Inactive</option>
                                    <option th:selected="${agent != null and agent.status == 'MAINTENANCE'}" value="MAINTENANCE">Maintenance</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Machine</label>
                                <input id="agent-machine" name="machine" type="text" class="form-control"
                                       placeholder="Hostname / identifier" th:value="${agent != null} ? ${agent.machine} : ''"/>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Heartbeat (ms)</label>
                                <input id="agent-heartbeat" name="heartbeat" type="number" min="0" class="form-control"
                                       th:value="${agent != null} ? ${agent.heartbeat} : 0"/>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Custom Programs</label>
                                <input id="agent-custom" name="customProgramCount" type="number" min="0" class="form-control"
                                       th:value="${agent != null} ? ${agent.customProgramCount} : 0"/>
                            </div>

                            <div class="col-12">
                                <label class="form-label">Description</label>
                                <textarea id="agent-desc" name="description" rows="3" class="form-control"
                                          placeholder="Optional notes" th:text="${agent != null} ? ${agent.description} : ''"></textarea>
                            </div>
                        </div>

                        <div class="d-flex gap-2 justify-content-end mt-3">
                            <button type="button" id="preview-btn" class="btn btn-outline-secondary">Preview</button>
                            <button type="submit" id="submit-btn" class="btn btn-primary">Save Changes</button>
                        </div>

                        <div id="form-alert" class="mt-3" style="display:none;"></div>
                    </div>
                </form>
            </div>

            <!-- preview / quick info column -->
            <div class="col-lg-4">
                <div class="custom-card p-3">
                    <h6 class="mb-3">Live Preview</h6>
                    <div id="preview-panel" style="min-height:180px;">
                        <div class="mb-2"><strong id="pv-name">-</strong> <small id="pv-status" class="text-muted">-</small></div>
                        <div class="small text-muted mb-2" id="pv-machine">Machine: -</div>
                        <table class="table table-sm mb-2">
                            <tbody>
                            <tr><td>ID</td><td id="pv-id">-</td></tr>
                            <tr><td>Heartbeat</td><td id="pv-heartbeat">-</td></tr>
                            <tr><td>Custom programs</td><td id="pv-custom">-</td></tr>
                            </tbody>
                        </table>
                        <div class="small text-muted" id="pv-desc">No description</div>
                    </div>

                    <hr/>

                    <div>
                        <small class="text-muted">Quick actions</small>
                        <div class="mt-2 d-grid gap-2">
                            <button id="preview-refresh" class="btn btn-sm btn-outline-primary">Refresh Preview</button>
                            <a href="/Monitoring/Agent/Landing" class="btn btn-sm btn-outline-secondary">Cancel</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<!-- client-side behaviour: validation, preview, AJAX submit (fallback to standard POST if JS disabled) -->
<script>
(function () {
    function qs(id){ return document.getElementById(id); }
    function setText(id, txt){ const el=qs(id); if(el) el.textContent = txt || '-'; }

    function updatePreview() {
        setText('pv-id', qs('agent-id').value.trim() || '-');
        setText('pv-name', qs('agent-name').value.trim() || '-');
        setText('pv-status', qs('agent-status').value);
        setText('pv-machine', 'Machine: ' + (qs('agent-machine').value.trim() || '-'));
        setText('pv-heartbeat', qs('agent-heartbeat').value || '0');
        setText('pv-custom', qs('agent-custom').value || '0');
        setText('pv-desc', qs('agent-desc').value.trim() || 'No description');
    }

    document.addEventListener('DOMContentLoaded', function () {
        const form = qs('edit-agent-form');
        const alertEl = qs('form-alert');

        ['agent-id','agent-name','agent-status','agent-machine','agent-heartbeat','agent-custom','agent-desc']
            .forEach(id => {
                const el = qs(id);
                if(!el) return;
                el.addEventListener('input', updatePreview);
            });

        qs('preview-btn').addEventListener('click', function () { updatePreview(); });
        qs('preview-refresh').addEventListener('click', function () { updatePreview(); });

        form.addEventListener('submit', function (e) {
            e.preventDefault();

            // validation
            const agentId = qs('agent-id').value.trim();
            const displayName = qs('agent-name').value.trim();
            if (!agentId || !displayName) {
                alertEl.className = 'alert alert-danger';
                alertEl.style.display = 'block';
                alertEl.textContent = 'Agent ID and Display Name are required.';
                return;
            }

            const payload = {
                id: qs('edit-agent-form').querySelector('input[name="id"]').value || null,
                agentId: agentId,
                displayName: displayName,
                status: qs('agent-status').value,
                machine: qs('agent-machine').value.trim(),
                heartbeat: Number(qs('agent-heartbeat').value) || 0,
                customProgramCount: Number(qs('agent-custom').value) || 0,
                description: qs('agent-desc').value.trim()
            };

            qs('submit-btn').disabled = true;
            qs('submit-btn').textContent = 'Saving...';
            alertEl.style.display = 'none';

            const action = form.getAttribute('action') || '/Monitoring/Agent/Update';
            fetch(action, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
                credentials: 'same-origin'
            }).then(function (resp) {
                qs('submit-btn').disabled = false;
                qs('submit-btn').textContent = 'Save Changes';
                if (resp.ok) {
                    alertEl.className = 'alert alert-success';
                    alertEl.style.display = 'block';
                    alertEl.textContent = 'Agent updated — redirecting...';
                    setTimeout(function(){ window.location.href = '/Monitoring/Agent/Landing'; }, 800);
                } else {
                    return resp.text().then(function (t) {
                        alertEl.className = 'alert alert-danger';
                        alertEl.style.display = 'block';
                        alertEl.textContent = 'Update failed: ' + (t || resp.statusText);
                    });
                }
            }).catch(function (err) {
                qs('submit-btn').disabled = false;
                qs('submit-btn').textContent = 'Save Changes';
                alertEl.className = 'alert alert-danger';
                alertEl.style.display = 'block';
                alertEl.textContent = 'Request error: ' + err;
            });
        });

        updatePreview();
    });
})();
</script>

</body>
</html>
