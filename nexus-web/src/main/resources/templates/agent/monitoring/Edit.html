<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <header th:insert="layout/AppLayout.html :: header"></header>
    <title>Edit Agent</title>
</head>
<body>
<div th:insert="layout/AppLayout.html :: nav"></div>
<div th:replace="layout/AppLayout.html :: sidebar"></div>

<div class="main-content">
    <div class="container-fluid px-3">
        <!-- Page Header -->
        <div class="page-hero">
            <div>
                <h1 class="page-title">
                    <i class="bi bi-pencil me-2" style="color: var(--color-primary);"></i>
                    Edit Agent
                </h1>
                <p class="page-subtitle mb-0">Modify agent configuration</p>
            </div>
            <div>
                <a th:href="@{/Monitoring/Agent/Landing}" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left me-1"></i>Back to Agents
                </a>
            </div>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card">
                    <div class="card-header">
                        <i class="bi bi-pc-display-horizontal me-2"></i>Agent Details
                    </div>
                    <div class="card-body">
                        <form method="post" th:action="@{/Monitoring/Agent/Update}">
                            <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}"/>
                            <input type="hidden" name="id" th:value="${agent.id}"/>
                            <input type="hidden" name="status" th:value="${agent.status}"/>
                            <input type="hidden" name="registeredAt" th:value="${agent.registeredAt}"/>
                            <input type="hidden" name="lastHeartbeat" th:value="${agent.lastHeartbeat}"/>
                            <input type="hidden" name="lastConnectedAt" th:value="${agent.lastConnectedAt}"/>

                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">Agent UUID</label>
                                    <input type="text" name="agentUuid" class="form-control"
                                           th:value="${agent.agentUuid}" readonly>
                                    <small class="text-muted">UUID cannot be changed</small>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Display Name <span class="text-danger">*</span></label>
                                    <input type="text" name="displayName" class="form-control" required
                                           th:value="${agent.displayName}">
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">Hostname</label>
                                    <input type="text" class="form-control"
                                           th:value="${agent.hostname}" readonly disabled>
                                    <small class="text-muted">Set by agent on connect</small>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">IP Address</label>
                                    <input type="text" class="form-control"
                                           th:value="${agent.ipAddress}" readonly disabled>
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">Working Directory</label>
                                    <input type="text" class="form-control"
                                           th:value="${agent.workingDirectory}" readonly disabled>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Status</label>
                                    <input type="text" class="form-control"
                                           th:value="${agent.status}" readonly disabled>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Description</label>
                                <textarea name="description" class="form-control" rows="3"
                                          th:text="${agent.description}"></textarea>
                            </div>

                            <div class="mb-3">
                                <div class="form-check">
                                    <input type="checkbox" name="enabled" class="form-check-input"
                                           id="enabledCheck" th:checked="${agent.enabled}">
                                    <label class="form-check-label" for="enabledCheck">
                                        Enabled (allow this agent to connect)
                                    </label>
                                </div>
                            </div>

                            <hr>

                            <div class="d-flex justify-content-between">
                                <a th:href="@{/Monitoring/Agent/Landing}" class="btn btn-outline-secondary">
                                    Cancel
                                </a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-check-lg me-1"></i>Save Changes
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Agent Info Card -->
                <div class="card mt-4">
                    <div class="card-header">
                        <i class="bi bi-info-circle me-2"></i>Agent Information
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6">
                                <p class="mb-1"><strong>OS:</strong>
                                    <span th:text="${agent.osName != null ? agent.osName + ' ' + (agent.osVersion ?: '') : 'Unknown'}">-</span>
                                </p>
                                <p class="mb-1"><strong>Java Version:</strong>
                                    <span th:text="${agent.javaVersion ?: 'Unknown'}">-</span>
                                </p>
                                <p class="mb-1"><strong>Agent Version:</strong>
                                    <span th:text="${agent.agentVersion ?: 'Unknown'}">-</span>
                                </p>
                            </div>
                            <div class="col-md-6">
                                <p class="mb-1"><strong>Last Heartbeat:</strong>
                                    <span th:text="${agent.lastHeartbeatFormatted}">-</span>
                                </p>
                                <p class="mb-1"><strong>Last Connected:</strong>
                                    <span th:text="${agent.lastConnectedAtFormatted}">-</span>
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
