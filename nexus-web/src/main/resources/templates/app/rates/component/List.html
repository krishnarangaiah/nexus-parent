<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <header th:insert="layout/AppLayout.html :: header"></header>
    <style>
        table.table-sm {
            table-layout: fixed; /* Fix the table layout */
            width: 100%; /* Ensure the table takes up the full width */
        }

        table.table-sm th, table.table-sm td {
            word-wrap: break-word; /* Prevent content overflow */
            overflow: hidden; /* Hide overflowing content */
            text-overflow: ellipsis; /* Add ellipsis for overflowing text */
            white-space: nowrap; /* Prevent text wrapping */
        }

        .cursor-pointer {
    cursor: pointer;
}

    </style>
</head>
<body>
<!-- <div th:insert="layout/AppLayout.html :: nav"></div> -->

<div id="componentListId" class="container-fluid h-100">

    <div class="row justify-content-center align-items-center w-100 mt-4">
        <div class="col-8">
            <div class="text-dark text-center mb-3">
                <h5 class="mb-0 fw-semibold">Component List</h5>
            </div>
            <div class="d-flex justify-content-end mb-2">
                <a href="/Rates/Component/SaveForm" class="btn btn-success btn-sm">
                    Add Component
                </a>
            </div>
            <hr/>

            <table class="table table-sm text-center">
                <thead th:if="${topologyComponents != null and #lists.size(topologyComponents) > 0}">
                <tr>
                    <th class="text-success">Component Name</th>
                    <th class="text-success">Description</th>
                    <th class="text-success">Action</th>
                </tr>
                </thead>

                <tbody th:if="${groupedComponents != null}">
                <th:block th:each="entry, iterStat : ${groupedComponents}">
                    <!-- Toggle row -->
                    <tr data-bs-toggle="collapse" th:data-bs-target="'#env-' + ${iterStat.index}"
                        class="table-secondary fw-bold text-start cursor-pointer">
                        <td colspan="3">
                            <i class="fa fa-chevron-down me-2 toggle-icon"></i>
                            <span th:text="${entry.key.name()}"></span>
                        </td>
                    </tr>

                    <!-- Collapsible content -->
                    <tr>
                        <td colspan="3" class="p-0 border-0">
                            <div class="collapse show" th:id="'env-' + ${iterStat.index}">
                                <table class="table table-sm mb-0">
                                    <tbody>
                                    <tr th:each="component : ${entry.value}">
                                        <td><span th:text="${component.componentName}"></span></td>
                                        <td><span th:text="${component.description}"></span></td>
                                        <td>
                                            <a href="#" class="deleteComponent" th:data-id="${component.id}">
                                                <i class="fa-solid fa-trash text-danger"></i>
                                            </a>
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </td>
                    </tr>
                </th:block>
                </tbody>


                <tbody th:if="${#maps.isEmpty(groupedComponents)}">
                <tr>
                    <td id="canBeReplacedId" colspan="3" class="text-center">
                        <span class="text-muted">No components found.</span>
                    </td>
                </tr>
                </tbody>
            </table>


        </div>
    </div>

</div>

<!-- Delete Confirmation Modal -->
<div class="modal fade" id="deleteConfirmModal" tabindex="-1" aria-labelledby="deleteConfirmModalLabel"
     aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="deleteConfirmModalLabel">Confirm Delete</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                Are you sure you want to delete this component?
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
            </div>
        </div>
    </div>
</div>


<script>
    $(document).ready(function() {

$(document).on('click', 'tr[data-bs-toggle="collapse"]', function () {
    const icon = $(this).find('.toggle-icon');
    const target = $(this).data('bs-target');
    $(target).on('shown.bs.collapse', function () {
        icon.removeClass('fa-chevron-down').addClass('fa-chevron-up');
    }).on('hidden.bs.collapse', function () {
        icon.removeClass('fa-chevron-up').addClass('fa-chevron-down');
    });
});

    let deleteComponentId = null;
    let deleteComponentName = null;

$(document).on('click', '.deleteComponent', function(e) {
    e.preventDefault();
    deleteComponentId = $(this).data('id');
    deleteComponentName = $(this).closest('tr').find('td').first().text();
    $('#deleteConfirmModal').modal('show');
});

$(document).on('click', '#confirmDeleteBtn', function() {
    if (!deleteComponentId) return;
    $.ajax({
        url: '/Rates/Component/Delete',
        type: 'POST',
        contentType: 'application/json',
        data: JSON.stringify({ id: deleteComponentId }),
        success: function(response) {
            window.location.href = '/Rates/Component/List';
        },
        error: function() {
            displayErrorMsg('Failed to delete component.');
        }
    });
    $('#deleteConfirmModal').modal('hide');
   // deleteComponentId = null;
});

});
</script>

</body>
</html>
