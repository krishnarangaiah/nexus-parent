# Nexus Agent runtime configuration (standalone agent; not a web app)
# WebSocket server URI the agent will connect to
server.uri=ws://localhost:9000/ws

# Agent identifier
agent.id=nexus-agent-1

# Interval (seconds) between metric pushes
metrics.interval.seconds=5

# Backoff settings for reconnects (in seconds)
reconnect.initial.seconds=2
reconnect.max.seconds=60

# Logging level hint (used by log config)
log.level=INFO
