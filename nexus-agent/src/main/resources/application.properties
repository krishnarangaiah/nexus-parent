# ==================== NEXUS AGENT CONFIGURATION ====================

# Agent UUID - MUST be passed as command line argument: --agent.uuid=YOUR-UUID
# This UUID must be pre-registered in the nexus-web database
agent.uuid=${AGENT_UUID:not-configured}

# Server WebSocket URL
agent.websocket.url=ws://localhost:9000/ws-plain

# Heartbeat interval in milliseconds (default: 30 seconds)
agent.heartbeat.interval-ms=30000

# Reconnect delay when connection is lost (default: 5 seconds)
agent.reconnect.delay-ms=5000

# Agent version
agent.version=1.0.0
